          // ----------------------------------------------------------------- player
          object Player {
              private var mp: MediaPlayer? = null
              var current by mutableStateOf<Uri?>(null)

              fun stop() {
                  try {
                      mp?.stop()
                  } catch (e: Exception) {
                  }
                  try {
                      mp?.release()
                  } catch (e: Exception) {
                  }
                  mp = null
                  current = null
              }

              fun toggle(ctx: Context, uri: Uri) {
                  if (current == uri) {
                      stop()
                      return
                  }
                  stop()
                  try {
                      val p = MediaPlayer()
                      p.setDataSource(ctx, uri)
                      p.setOnCompletionListener { stop() }
                      p.prepare()
                      p.start()
                      mp = p
                      current = uri
                  } catch (e: Exception) {
                      Toast.makeText(ctx, "Cannot play", Toast.LENGTH_SHORT).show()
                      stop()
                  }
              }
          }

