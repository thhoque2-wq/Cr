              var libraryVersion by mutableIntStateOf(0)
              var silentWarn by mutableStateOf(false)
          }

          object Prefs {
              private fun sp(c: Context) = c.getSharedPreferences("crp_settings", Context.MODE_PRIVATE)

              fun load(c: Context): CallSettings {
                  val p = sp(c)
                  val d = CallSettings()
                  return CallSettings(
                      source = p.getInt("src", d.source),
                      kbps = p.getInt("kbps", d.kbps),
                      bengali = p.getBoolean("bn", d.bengali),
                      consent = p.getBoolean("consent", d.consent)
                  )
              }

              fun save(c: Context, s: CallSettings) {
                  sp(c).edit()
                      .putInt("src", s.source)
                      .putInt("kbps", s.kbps)
                      .putBoolean("bn", s.bengali)
                      .putBoolean("consent", s.consent)
                      .apply()
              }
          }
