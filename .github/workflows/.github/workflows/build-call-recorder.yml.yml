                  SectionCard(tr(bn, "🎙 Audio source", "🎙 অডিও সোর্স")) {
                      OptionRow(
                          tr(bn, "Try another one if recordings are silent", "রেকর্ডিংয়ে সাউন্ড না এলে অন্যটা চেষ্টা করুন"),
                          listOf(
                              tr(bn, "Mic", "মাইক") to 0,
                              tr(bn, "Voice recognition", "ভয়েস রিকগনিশন") to 1,
                              tr(bn, "Voice communication", "ভয়েস কমিউনিকেশন") to 2,
                              tr(bn, "Camcorder", "ক্যামকর্ডার") to 3,
                              tr(bn, "Unprocessed", "আনপ্রসেসড") to 4
                          ),
                          s.source
                      ) { onChange(s.copy(source = it)) }
                      Text(
                          tr(
                              bn,
                              "Android blocks normal apps from the call audio, so results depend on your phone. Speakerphone gives the best result.",
                              "Android সাধারণ অ্যাপকে কলের অডিও নিতে দেয় না, তাই ফলাফল ফোনভেদে আলাদা। স্পিকারে দিলে সবচেয়ে ভালো আসে।"
                          ),
                          color = C.Muted, fontSize = 12.sp
                      )
                  }

                  SectionCard(tr(bn, "🎚 Quality", "🎚 কোয়ালিটি")) {
                      OptionRow(
                          tr(bn, "Bitrate", "বিটরেট"),
                          listOf("32 kbps" to 32, "64 kbps" to 64, "128 kbps" to 128),
                          s.kbps
                      ) { onChange(s.copy(kbps = it)) }
                      Text(tr(bn, "64 kbps is about 0.5 MB per minute.", "৬৪ kbps ≈ প্রতি মিনিটে ০.৫ MB।"), color = C.Muted, fontSize = 12.sp)
                  }

                  SectionCard(tr(bn, "🌐 App", "🌐 অ্যাপ")) {
                      ToggleRow("বাংলা / English", tr(bn, "On = Bangla, Off = English", "চালু = বাংলা, বন্ধ = English"), s.bengali) {
                          onChange(s.copy(bengali = it))
                      }
                  }

                  SectionCard(tr(bn, "⚖ Legal", "⚖ আইনি বিষয়")) {
                      Text(
                          tr(
                              bn,
                              "Recording a call without the other person's consent may be illegal in your country. Use this app for your own notes or with permission, and tell the other person you are recording.",
                              "অপর পক্ষের অনুমতি ছাড়া কল রেকর্ড করা আপনার দেশে বেআইনি হতে পারে। নিজের নোটের জন্য বা অনুমতি নিয়ে ব্যবহার করুন, আর রেকর্ড করছেন সেটা অপর পক্ষকে জানিয়ে দিন।"
                          ),
                          color = C.Muted, fontSize = 12.sp, lineHeight = 17.sp
                      )
                  }
                  Spacer(Modifier.height(10.dp))
              }
          }
