          // --------------------------------------------------------------- recordings
          data class RecItem(val uri: Uri, val name: String, val durMs: Long, val size: Long, val dateSec: Long)

          fun loadRecs(ctx: Context): List<RecItem> {
              val out = ArrayList<RecItem>()
              val proj = arrayOf(
                  MediaStore.Audio.Media._ID,
                  MediaStore.Audio.Media.DISPLAY_NAME,
                  MediaStore.Audio.Media.DURATION,
                  MediaStore.Audio.Media.SIZE,
                  MediaStore.Audio.Media.DATE_ADDED
              )
              try {
                  ctx.contentResolver.query(
                      MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                      proj,
                      MediaStore.Audio.Media.RELATIVE_PATH + " LIKE ?",
                      arrayOf("%CallRecorder%"),
                      MediaStore.Audio.Media.DATE_ADDED + " DESC"
                  )?.use { c ->
                      while (c.moveToNext()) {
                          out.add(
                              RecItem(
                                  ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, c.getLong(0)),
                                  c.getString(1) ?: "rec.m4a",
                                  c.getLong(2), c.getLong(3), c.getLong(4)
                              )
                          )
                      }
                  }
              } catch (e: Exception) {
              }
              return out
          }

          fun shareRec(ctx: Context, uri: Uri) {
              try {
                  val i = Intent(Intent.ACTION_SEND)
                  i.type = "audio/mp4"
                  i.putExtra(Intent.EXTRA_STREAM, uri)
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  ctx.startActivity(Intent.createChooser(i, "Share"))
              } catch (e: Exception) {
                  Toast.makeText(ctx, "Cannot share", Toast.LENGTH_SHORT).show()
              }
          }

          @Composable
          fun RecCard(r: RecItem, bn: Boolean, onDelete: () -> Unit) {
              val ctx = LocalContext.current
              val base = r.name.removeSuffix(".m4a")
              val parts = base.split("_")
              var dir = parts.getOrElse(0) { "CALL" }
              val silent = dir.endsWith("S")
              if (silent) dir = dir.dropLast(1)
              val label = if (parts.size >= 4) parts.subList(1, parts.size - 2).joinToString(" ").replace("-", " ") else base
              val badge = when (dir) {
                  "IN" -> tr(bn, "Incoming", "ইনকামিং")
                  "OUT" -> tr(bn, "Outgoing", "আউটগোয়িং")
                  "REC" -> tr(bn, "Manual", "ম্যানুয়াল")
                  else -> tr(bn, "Call", "কল")
              }
              val color = when (dir) {
                  "IN" -> C.Accent
                  "OUT" -> C.Accent2
                  else -> C.Muted
              }
              val date = SimpleDateFormat("dd MMM yyyy, hh:mm a", Locale.getDefault()).format(Date(r.dateSec * 1000L))
              val playing = Player.current == r.uri
              Column(
                  Modifier.fillMaxWidth().clip(RoundedCornerShape(18.dp)).background(C.Card).padding(12.dp)
              ) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Box(
                          Modifier.size(46.dp).clip(CircleShape).background(if (playing) C.Accent else C.Line)
                              .clickable { Player.toggle(ctx, r.uri) },
                          contentAlignment = Alignment.Center
                      ) { Text(if (playing) "⏹" else "▶", fontSize = 18.sp, color = Color.White) }
                      Spacer(Modifier.width(12.dp))
                      Column(Modifier.weight(1f)) {
                          Text(label, color = C.Text, fontSize = 15.sp, fontWeight = FontWeight.Medium, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text(badge, color = color, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              Text("  •  " + fmtTime(r.durMs) + "  •  " + String.format(Locale.US, "%.1f MB", r.size / 1048576.0), color = C.Muted, fontSize = 12.sp)
                          }
                          Text(date + (if (silent) "  ⚠ " + tr(bn, "silent", "সাউন্ড নেই") else ""), color = C.Muted, fontSize = 12.sp)
                      }
                  }
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                      TextButton(onClick = { shareRec(ctx, r.uri) }) { Text("↗ " + tr(bn, "Share", "শেয়ার"), color = C.Accent2) }
                      TextButton(onClick = onDelete) { Text("🗑 " + tr(bn, "Delete", "ডিলিট"), color = C.Muted) }
                  }
              }
          }

          @Composable
          fun RecordingsScreen(bn: Boolean) {
              val ctx = LocalContext.current
              var recs by remember { mutableStateOf(listOf<RecItem>()) }
              var toDelete by remember { mutableStateOf<RecItem?>(null) }
              var tick by remember { mutableIntStateOf(0) }
              var query by remember { mutableStateOf("") }

              LaunchedEffect(tick, CR.libraryVersion) {
                  recs = withContext(Dispatchers.IO) { loadRecs(ctx) }
              }
              val shown = if (query.isBlank()) recs else recs.filter { it.name.contains(query.trim(), ignoreCase = true) }

              Column(Modifier.fillMaxSize().background(C.Bg).padding(16.dp)) {
                  Text(tr(bn, "Recordings", "রেকর্ডিং"), color = C.Text, fontSize = 24.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(10.dp))
                  OutlinedTextField(
                      value = query,
                      onValueChange = { query = it },
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth(),
                      placeholder = { Text(tr(bn, "Search name or number", "নাম বা নম্বর খুঁজুন"), color = C.Muted) }
                  )
                  Spacer(Modifier.height(10.dp))
                  if (shown.isEmpty()) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text(tr(bn, "No recordings yet", "এখনো কোনো রেকর্ডিং নেই"), color = C.Muted, fontSize = 15.sp)
                      }
                  } else {
                      LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          items(shown, key = { it.uri.toString() }) { r ->
                              RecCard(r, bn) { toDelete = r }
                          }
                      }
                  }
              }

              val d = toDelete
              if (d != null) {
                  AlertDialog(
                      onDismissRequest = { toDelete = null },
                      containerColor = C.Card,
                      title = { Text(tr(bn, "Delete recording?", "রেকর্ডিং ডিলিট করবেন?"), color = C.Text) },
                      text = { Text(d.name, color = C.Muted) },
                      confirmButton = {
                          TextButton(onClick = {
                              if (Player.current == d.uri) Player.stop()
                              try {
                                  ctx.contentResolver.delete(d.uri, null, null)
                              } catch (e: Exception) {
                                  Toast.makeText(ctx, "Cannot delete", Toast.LENGTH_SHORT).show()
                              }
                              toDelete = null
                              tick += 1
                          }) { Text(tr(bn, "Delete", "ডিলিট"), color = C.Rec) }
                      },
                      dismissButton = {
                          TextButton(onClick = { toDelete = null }) { Text(tr(bn, "Cancel", "বাতিল"), color = C.Muted) }
                      }
                  )
              }
          }

          // ----------------------------------------------------------------- settings
          @Composable
          fun SettingsScreen(s: CallSettings, onChange: (CallSettings) -> Unit) {
              val bn = s.bengali
              Column(
                  Modifier.fillMaxSize().background(C.Bg).verticalScroll(rememberScrollState()).padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp)
              ) {
