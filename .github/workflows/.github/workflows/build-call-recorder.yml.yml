          data class CallSettings(
              val source: Int = 0,      // 0 mic, 1 voice recognition, 2 voice communication, 3 camcorder, 4 unprocessed
              val kbps: Int = 64,
              val bengali: Boolean = true,
              val consent: Boolean = false
          )

