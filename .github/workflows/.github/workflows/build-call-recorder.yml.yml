name: Build Call Recorder Pro APK

# How to use: put this file at .github/workflows/build-call-recorder.yml in a GitHub repo,
# push it, then open the Actions tab. The APK appears under Artifacts and under Releases.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses and install platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate project files
        run: |
          mkdir -p CallRecorderPro CallRecorderPro/app CallRecorderPro/app/src/main CallRecorderPro/app/src/main/java/com/hiddeninfo/callrecorder CallRecorderPro/app/src/main/res/drawable CallRecorderPro/app/src/main/res/mipmap-anydpi-v26 CallRecorderPro/app/src/main/res/values
          cat > CallRecorderPro/app/build.gradle.kts <<'KTEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.hiddeninfo.callrecorder"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.hiddeninfo.callrecorder"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          KTEOF
          cat > CallRecorderPro/app/src/main/AndroidManifest.xml <<'KTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.App">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CallRecService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          KTEOF
          cat > CallRecorderPro/app/src/main/java/com/hiddeninfo/callrecorder/CallRecService.kt <<'KTEOF'
          package com.hiddeninfo.callrecorder

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ContentResolver
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.drawable.Icon
          import android.media.MediaRecorder
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.ParcelFileDescriptor
          import android.os.SystemClock
          import android.provider.CallLog
          import android.provider.MediaStore
          import android.telephony.PhoneStateListener
          import android.telephony.TelephonyCallback
          import android.telephony.TelephonyManager
          import android.widget.Toast
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class CallRecService : Service() {

              companion object {
                  const val ACTION_LISTEN = "com.hiddeninfo.callrecorder.LISTEN"
                  const val ACTION_STOP_LISTEN = "com.hiddeninfo.callrecorder.STOP_LISTEN"
                  const val ACTION_REC_NOW = "com.hiddeninfo.callrecorder.REC_NOW"
                  const val ACTION_REC_STOP = "com.hiddeninfo.callrecorder.REC_STOP"
                  const val CH_REC = "callrec_channel"
                  const val CH_DONE = "callrec_done"
                  const val NID = 201
                  const val DONE_ID = 202
              }

              private var settings = CallSettings()
              private var recorder: MediaRecorder? = null
              private var pfd: ParcelFileDescriptor? = null
              private var outUri: Uri? = null
              private var recStartMs = 0L
              private var peak = 0
              private var isCall = false
              private var cb: Any? = null
              private var fgOk = false
              private val handler = Handler(Looper.getMainLooper())

              private fun t(en: String, bn: String): String = if (settings.bengali) bn else en

              private val ticker = object : Runnable {
                  override fun run() {
                      if (CR.recording) {
                          CR.elapsedMs = SystemClock.elapsedRealtime() - recStartMs
                          try {
                              val a = recorder?.maxAmplitude ?: 0
                              if (a > peak) peak = a
                          } catch (e: Exception) {
                          }
                          handler.postDelayed(this, 500)
                      }
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  settings = Prefs.load(this)
                  when (intent?.action) {
                      ACTION_LISTEN -> {
                          if (ensureForeground()) startListening()
                      }
                      ACTION_REC_NOW -> {
                          if (ensureForeground()) startRec(false)
                      }
                      ACTION_REC_STOP -> if (CR.recording) stopRec()
                      ACTION_STOP_LISTEN -> stopListening()
                      else -> if (!CR.listening && !CR.recording) stopSelf()
                  }
                  return START_NOT_STICKY
              }

              private fun ensureForeground(): Boolean {
                  createChannels()
                  try {
                      if (Build.VERSION.SDK_INT >= 30) {
                          startForeground(NID, buildNotification(), ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                      } else {
                          startForeground(NID, buildNotification())
                      }
                      fgOk = true
                      return true
                  } catch (e: Exception) {
                      Toast.makeText(this, t("Cannot start: ", "চালু করা যায়নি: ") + e.message, Toast.LENGTH_LONG).show()
                      stopSelf()
                      return false
                  }
              }

              // --------------------------------------------------------- call listener
              @Suppress("DEPRECATION")
              private fun startListening() {
                  if (CR.listening) {
                      updateNotification()
                      return
                  }
                  try {
                      val tm = getSystemService(TELEPHONY_SERVICE) as TelephonyManager
                      if (Build.VERSION.SDK_INT >= 31) {
                          val c = object : TelephonyCallback(), TelephonyCallback.CallStateListener {
                              override fun onCallStateChanged(state: Int) {
                                  handleState(state)
                              }
                          }
                          tm.registerTelephonyCallback(mainExecutor, c)
                          cb = c
                      } else {
                          val l = object : PhoneStateListener() {
                              override fun onCallStateChanged(state: Int, phoneNumber: String?) {
                                  handleState(state)
                              }
                          }
                          tm.listen(l, PhoneStateListener.LISTEN_CALL_STATE)
                          cb = l
                      }
                      CR.listening = true
                      updateNotification()
                  } catch (e: Exception) {
                      Toast.makeText(this, t("Phone permission needed", "ফোন পারমিশন দরকার"), Toast.LENGTH_LONG).show()
                      stopListening()
                  }
              }

              @Suppress("DEPRECATION")
              private fun unregisterCalls() {
                  try {
                      val tm = getSystemService(TELEPHONY_SERVICE) as TelephonyManager
                      val c = cb
                      if (Build.VERSION.SDK_INT >= 31 && c is TelephonyCallback) {
                          tm.unregisterTelephonyCallback(c)
                      } else if (c is PhoneStateListener) {
                          tm.listen(c, PhoneStateListener.LISTEN_NONE)
                      }
                  } catch (e: Exception) {
                  }
                  cb = null
              }

              private fun stopListening() {
                  unregisterCalls()
                  CR.listening = false
                  if (CR.recording) stopRec()
                  try {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                  } catch (e: Exception) {
                  }
                  stopSelf()
              }

              private fun handleState(state: Int) {
                  settings = Prefs.load(this)
                  if (state == TelephonyManager.CALL_STATE_OFFHOOK) {
                      if (!CR.recording) startRec(true)
                  } else if (state == TelephonyManager.CALL_STATE_IDLE) {
                      if (CR.recording && isCall) stopRec()
                  }
              }

              // ------------------------------------------------------------- recording
              private fun sourceConst(i: Int): Int = when (i) {
                  1 -> MediaRecorder.AudioSource.VOICE_RECOGNITION
                  2 -> MediaRecorder.AudioSource.VOICE_COMMUNICATION
                  3 -> MediaRecorder.AudioSource.CAMCORDER
                  4 -> MediaRecorder.AudioSource.UNPROCESSED
                  else -> MediaRecorder.AudioSource.MIC
              }

              @Suppress("DEPRECATION")
              private fun buildRecorder(src: Int, fd: java.io.FileDescriptor): MediaRecorder {
                  val r = if (Build.VERSION.SDK_INT >= 31) MediaRecorder(this) else MediaRecorder()
                  try {
                      r.setAudioSource(src)
                      r.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                      r.setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                      r.setAudioEncodingBitRate(settings.kbps * 1000)
                      r.setAudioSamplingRate(44100)
                      r.setAudioChannels(1)
                      r.setOutputFile(fd)
                      r.prepare()
                      r.start()
                  } catch (e: Exception) {
                      try {
                          r.release()
                      } catch (e2: Exception) {
                      }
                      throw e
                  }
                  return r
              }

              private fun startRec(call: Boolean) {
                  if (CR.recording) return
                  settings = Prefs.load(this)
                  if (checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, t("Microphone permission needed", "মাইক পারমিশন দরকার"), Toast.LENGTH_LONG).show()
                      return
                  }
                  try {
                      val ts = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                      val name = (if (call) "CALL" else "REC") + "_Unknown_" + ts + ".m4a"
                      val v = ContentValues()
                      v.put(MediaStore.Audio.Media.DISPLAY_NAME, name)
                      v.put(MediaStore.Audio.Media.MIME_TYPE, "audio/mp4")
                      v.put(MediaStore.Audio.Media.RELATIVE_PATH, Environment.DIRECTORY_MUSIC + "/CallRecorder")
                      v.put(MediaStore.Audio.Media.IS_PENDING, 1)
                      val uri = contentResolver.insert(MediaStore.Audio.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY), v)
                      if (uri == null) {
                          Toast.makeText(this, t("Cannot create file", "ফাইল তৈরি করা যায়নি"), Toast.LENGTH_LONG).show()
                          return
                      }
                      outUri = uri
                      val p = contentResolver.openFileDescriptor(uri, "rw")
                      pfd = p
                      var r: MediaRecorder
                      try {
                          r = buildRecorder(sourceConst(settings.source), p!!.fileDescriptor)
                      } catch (e: Exception) {
                          r = buildRecorder(MediaRecorder.AudioSource.MIC, p!!.fileDescriptor)
                      }
                      recorder = r
                      isCall = call
                      peak = 0
                      recStartMs = SystemClock.elapsedRealtime()
                      CR.elapsedMs = 0L
                      CR.silentWarn = false
                      CR.recording = true
                      handler.removeCallbacks(ticker)
                      handler.post(ticker)
                      updateNotification()
                  } catch (e: Exception) {
                      Toast.makeText(this, t("Recorder error: ", "রেকর্ডার সমস্যা: ") + e.message, Toast.LENGTH_LONG).show()
                      discardOutput()
                      CR.recording = false
                      afterFinish()
                  }
              }

              private fun discardOutput() {
                  try {
                      pfd?.close()
                  } catch (e: Exception) {
                  }
                  pfd = null
                  val u = outUri
                  outUri = null
                  if (u != null) {
                      try {
                          contentResolver.delete(u, null, null)
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun stopRec() {
                  if (!CR.recording) return
                  handler.removeCallbacks(ticker)
                  val r = recorder
                  recorder = null
                  CR.recording = false
                  var ok = true
                  try {
                      val a = r?.maxAmplitude ?: 0
                      if (a > peak) peak = a
                  } catch (e: Exception) {
                  }
                  try {
                      r?.stop()
                  } catch (e: Exception) {
                      ok = false
                  }
                  try {
                      r?.release()
                  } catch (e: Exception) {
                  }
                  try {
                      pfd?.close()
                  } catch (e: Exception) {
                  }
                  pfd = null
                  val dur = SystemClock.elapsedRealtime() - recStartMs
                  val uri = outUri
                  outUri = null
                  val wasCall = isCall
                  val silent = peak < 40
                  val startedAt = Date(System.currentTimeMillis() - dur)
                  if (uri == null) {
                      afterFinish()
                      return
                  }
                  if (!ok || dur < 3000) {
                      try {
                          contentResolver.delete(uri, null, null)
                      } catch (e: Exception) {
                      }
                      afterFinish()
                      return
                  }
                  updateNotification()
                  Thread {
                      try {
                          if (wasCall) Thread.sleep(1800)
                          var dir = "CALL"
                          var label = "Unknown"
                          if (wasCall) {
                              val info = lookupLastCall()
                              if (info != null) {
                                  dir = info.first
                                  label = info.second
                              }
                          } else {
                              dir = "REC"
                              label = "Manual"
                          }
                          if (silent) dir += "S"
                          val ts = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(startedAt)
                          val v = ContentValues()
                          v.put(MediaStore.Audio.Media.DISPLAY_NAME, dir + "_" + label + "_" + ts + ".m4a")
                          v.put(MediaStore.Audio.Media.IS_PENDING, 0)
                          contentResolver.update(uri, v, null, null)
                      } catch (e: Exception) {
                          try {
                              val v2 = ContentValues()
                              v2.put(MediaStore.Audio.Media.IS_PENDING, 0)
                              contentResolver.update(uri, v2, null, null)
                          } catch (e2: Exception) {
                          }
                      }
                      handler.post {
                          CR.silentWarn = silent
                          CR.libraryVersion = CR.libraryVersion + 1
                          showDone(uri, silent)
                          afterFinish()
                      }
                  }.start()
              }

              private fun afterFinish() {
                  if (CR.listening) {
                      updateNotification()
                  } else {
                      try {
                          stopForeground(STOP_FOREGROUND_REMOVE)
                      } catch (e: Exception) {
                      }
                      stopSelf()
                  }
              }

              private fun lookupLastCall(): Pair<String, String>? {
                  if (checkSelfPermission(android.Manifest.permission.READ_CALL_LOG) != PackageManager.PERMISSION_GRANTED) return null
                  try {
                      val args = Bundle()
                      args.putInt(ContentResolver.QUERY_ARG_LIMIT, 1)
                      args.putStringArray(ContentResolver.QUERY_ARG_SORT_COLUMNS, arrayOf(CallLog.Calls.DATE))
                      args.putInt(ContentResolver.QUERY_ARG_SORT_DIRECTION, ContentResolver.QUERY_SORT_DIRECTION_DESCENDING)
                      contentResolver.query(
                          CallLog.Calls.CONTENT_URI,
                          arrayOf(CallLog.Calls.NUMBER, CallLog.Calls.CACHED_NAME, CallLog.Calls.TYPE),
                          args, null
                      )?.use { c ->
                          if (c.moveToFirst()) {
                              val number = c.getString(0) ?: ""
                              val name = c.getString(1) ?: ""
                              val type = c.getInt(2)
                              val dir = if (type == CallLog.Calls.OUTGOING_TYPE) "OUT" else "IN"
                              var label = if (name.isNotEmpty()) name else number
                              label = label.replace(Regex("[^\\p{L}\\p{N}+ -]"), "").trim().replace(" ", "-")
                              if (label.isEmpty()) label = "Unknown"
                              return Pair(dir, label)
                          }
                      }
                  } catch (e: Exception) {
                  }
                  return null
              }

              // ---------------------------------------------------------- notifications
              private fun createChannels() {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel(CH_REC, "Call recording", NotificationManager.IMPORTANCE_LOW))
                  nm.createNotificationChannel(NotificationChannel(CH_DONE, "Saved recordings", NotificationManager.IMPORTANCE_DEFAULT))
              }

              private fun servicePi(action: String, rc: Int): PendingIntent {
                  val i = Intent(this, CallRecService::class.java)
                  i.action = action
                  return PendingIntent.getService(this, rc, i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
              }

              private fun buildNotification(): Notification {
                  val open = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_NEW_TASK),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val icon = Icon.createWithResource(this, R.drawable.ic_stat)
                  val rec = CR.recording
                  val b = Notification.Builder(this, CH_REC)
                      .setSmallIcon(R.drawable.ic_stat)
                      .setContentTitle(if (rec) t("Recording...", "রেকর্ড হচ্ছে...") else t("Auto call recording is ON", "অটো কল রেকর্ডিং চালু আছে"))
                      .setContentText(if (rec) t("Tap Stop to finish", "শেষ করতে Stop চাপুন") else t("Waiting for calls", "কলের অপেক্ষায়"))
                      .setContentIntent(open)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                  if (rec) {
                      b.setShowWhen(true)
                      b.setWhen(System.currentTimeMillis() - CR.elapsedMs)
                      b.setUsesChronometer(true)
                      b.addAction(Notification.Action.Builder(icon, t("Stop", "বন্ধ"), servicePi(ACTION_REC_STOP, 1)).build())
                  } else if (CR.listening) {
                      b.addAction(Notification.Action.Builder(icon, t("Turn off", "বন্ধ করুন"), servicePi(ACTION_STOP_LISTEN, 2)).build())
                  }
                  if (Build.VERSION.SDK_INT >= 31) {
                      b.setForegroundServiceBehavior(Notification.FOREGROUND_SERVICE_IMMEDIATE)
                  }
                  return b.build()
              }

              private fun updateNotification() {
                  if (!fgOk) return
                  try {
                      val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                      nm.notify(NID, buildNotification())
                  } catch (e: Exception) {
                  }
              }

              private fun showDone(uri: Uri, silent: Boolean) {
                  try {
                      val view = Intent(Intent.ACTION_VIEW)
                      view.setDataAndType(uri, "audio/mp4")
                      view.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                      val pi = PendingIntent.getActivity(this, 5, view, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                      val text = if (silent) t(
                          "Sounded silent - try another audio source or use speakerphone",
                          "সাউন্ড আসেনি - অন্য অডিও সোর্স বা স্পিকার ব্যবহার করে দেখুন"
                      ) else t("Tap to play", "শুনতে ট্যাপ করুন")
                      val n = Notification.Builder(this, CH_DONE)
                          .setSmallIcon(R.drawable.ic_stat)
                          .setContentTitle(t("Recording saved", "রেকর্ডিং সেভ হয়েছে"))
                          .setContentText(text)
                          .setContentIntent(pi)
                          .setAutoCancel(true)
                          .build()
                      (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).notify(DONE_ID, n)
                  } catch (e: Exception) {
                  }
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  unregisterCalls()
                  super.onDestroy()
              }
          }
          KTEOF
          cat > CallRecorderPro/app/src/main/java/com/hiddeninfo/callrecorder/MainActivity.kt <<'KTEOF'
          package com.hiddeninfo.callrecorder

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue

          class MainActivity : ComponentActivity() {

              private var settings by mutableStateOf(CallSettings())
              private var pendingAction = 0   // 1 = auto listen, 2 = manual record

              private val permLauncher = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { _ ->
                  continueAfterPermissions()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  settings = Prefs.load(this)
                  setContent {
                      AppTheme {
                          Root(
                              s = settings,
                              onSettings = { settings = it; Prefs.save(this@MainActivity, it) },
                              onToggleAuto = { on -> if (on) requestAuto() else send(CallRecService.ACTION_STOP_LISTEN) },
                              onManual = { pendingAction = 2; ensurePermissions() },
                              onManualStop = { send(CallRecService.ACTION_REC_STOP) }
                          )
                      }
                  }
              }

              private fun requestAuto() {
                  pendingAction = 1
                  ensurePermissions()
              }

              private fun has(p: String) = checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED

              private fun ensurePermissions() {
                  val need = ArrayList<String>()
                  if (!has(Manifest.permission.RECORD_AUDIO)) need.add(Manifest.permission.RECORD_AUDIO)
                  if (pendingAction == 1) {
                      if (!has(Manifest.permission.READ_PHONE_STATE)) need.add(Manifest.permission.READ_PHONE_STATE)
                      if (!has(Manifest.permission.READ_CALL_LOG)) need.add(Manifest.permission.READ_CALL_LOG)
                  }
                  if (Build.VERSION.SDK_INT >= 33 && !has(Manifest.permission.POST_NOTIFICATIONS)) {
                      need.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  if (need.isEmpty()) continueAfterPermissions() else permLauncher.launch(need.toTypedArray())
              }

              private fun continueAfterPermissions() {
                  val bn = settings.bengali
                  if (!has(Manifest.permission.RECORD_AUDIO)) {
                      Toast.makeText(this, tr(bn, "Microphone permission is required", "মাইক পারমিশন লাগবে"), Toast.LENGTH_LONG).show()
                      return
                  }
                  if (pendingAction == 1) {
                      if (!has(Manifest.permission.READ_PHONE_STATE)) {
                          Toast.makeText(this, tr(bn, "Phone permission is required", "ফোন পারমিশন লাগবে"), Toast.LENGTH_LONG).show()
                          return
                      }
                      startFg(CallRecService.ACTION_LISTEN)
                  } else if (pendingAction == 2) {
                      startFg(CallRecService.ACTION_REC_NOW)
                  }
                  pendingAction = 0
              }

              private fun startFg(action: String) {
                  val i = Intent(this, CallRecService::class.java)
                  i.action = action
                  startForegroundService(i)
              }

              private fun send(action: String) {
                  try {
                      val i = Intent(this, CallRecService::class.java)
                      i.action = action
                      startService(i)
                  } catch (e: Exception) {
                  }
              }

              override fun onDestroy() {
                  Player.stop()
                  super.onDestroy()
              }
          }
