      - name: Build release APK
        run: gradle -p CallRecorderPro :app:assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp CallRecorderPro/app/build/outputs/apk/release/*.apk out/CallRecorderPro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallRecorderPro-APK
          path: out/CallRecorderPro.apk

      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Call Recorder Pro build ${{ github.run_number }}
          files: out/CallRecorderPro.apk
